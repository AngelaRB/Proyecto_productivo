{% extends "base.html" %}
{%block title%}Diario{%endblock%}
{% block content%}
    
    <main>
        <div class="container">
            <h1 id="title_diario">Mi diario</h1>
            
            
            <a href="{{url_for('agregar_diario')}}" class="nuevo_diario">
               <div>
                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
                        </svg>
                    </div>
                    <div>
                        <p>Nuevo pensamiento...</p>
                    </div>
               </div>
            
            </a>
            
            
            
        </div>
        </div>

        
        {% for diario in diarios %}
            <div class="">
                <div class="leer_diario">
                    <button class="openModal modal-btn">{{diario.titulo}}</button>
                    <div>
                        <p>{{diario.fecha}}</p>
                    </div>

                    <div class="modal">
                        <div class="modal-inner">
                            <h2>Para leer esta entrada, ingresa tu contraseña</h2>
                            <input type="password" class="password-input" placeholder="Contraseña">
                            <p class="error-msg" style="color: red; display: none;">Contraseña incorrecta</p>
                            <div>
                                <button class="diarioPage ingresar-btn modal-btn" data-id="{{diario.id}}">Ingresar</button>
                                <button class="closeModal modal-btn">Cerrar</button>
                                
                            </div>
                            
                        </div> 
                        
                    </div>
                    
                </div>
                
            </div>
            {%endfor%}       
    </main>
    <script src="../static/js/modal.js"></script>
</body>
{%endblock%}
